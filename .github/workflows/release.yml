name: 🚀 Create Release
run-name: 🚀 Create Release ${{ inputs.version }}

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10.x.x"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., v1.0.0)"
        required: true
        type: string

jobs:
  release:
    name: 📦 Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Validate version format
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must match format v#.#.# (e.g., v1.0.0)"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: "https://registry.npmjs.org/"

      - name: Check package.json version matches the release
        env:
          VERSION: ${{ inputs.version }}
        working-directory: packages/starlight-agent-docs
        run: |
          EXPECTED=${VERSION#v}
          ACTUAL=$(node -p "require('./package.json').version")
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error title=package.json version mismatch::Releasing $VERSION, but packages/starlight-agent-docs/package.json is at version $ACTUAL."
            echo "To fix this:"
            echo "  1. Set \"version\" to \"$EXPECTED\" in packages/starlight-agent-docs/package.json."
            echo "  2. Update packages/starlight-agent-docs/CHANGELOG.md for $EXPECTED."
            echo "  3. Merge those changes to main, then re-run this workflow."
            exit 1
          fi

      - name: Check CHANGELOG.md has an entry for the release
        env:
          VERSION: ${{ inputs.version }}
        working-directory: packages/starlight-agent-docs
        run: |
          EXPECTED=${VERSION#v}
          if ! grep -Fq "## [$EXPECTED]" CHANGELOG.md; then
            echo "::error title=CHANGELOG.md entry missing::No \"## [$EXPECTED]\" heading found in packages/starlight-agent-docs/CHANGELOG.md."
            echo "To fix this, rename the \"## [Unreleased]\" heading to \"## [$EXPECTED] - $(date -u +%Y-%m-%d)\" (or add a new section),"
            echo "merge the change to main, then re-run this workflow."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Verify repository
        run: pnpm verify

      - name: Run unit tests
        run: pnpm test

      - name: Run integration tests
        run: pnpm test:integration

      - name: Run consumer typecheck
        run: pnpm test:consumer-types

      - name: Check version doesn't already exist
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if git tag -l | grep -qx "$VERSION"; then
            echo "::error::Tag $VERSION already exists"
            exit 1
          fi

      - name: Check version is newer than latest
        env:
          VERSION: ${{ inputs.version }}
        run: |
          LATEST=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          if [ -n "$LATEST" ]; then
            LATEST_CLEAN=${LATEST#v}
            NEW_CLEAN=${VERSION#v}
            if ! printf '%s\n%s\n' "$LATEST_CLEAN" "$NEW_CLEAN" \
                 | sort -V | tail -n1 | grep -qx "$NEW_CLEAN"; then
              echo "::error::$VERSION is not newer than $LATEST"
              exit 1
            fi
          fi

      - name: Create tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$VERSION"
          git push origin --tags

      - name: Create GitHub release
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes "See [CHANGELOG.md](https://github.com/NIT-Administrative-Systems/starlight-agent-docs/blob/main/packages/starlight-agent-docs/CHANGELOG.md) for details." \
            --verify-tag

      - name: Publish to npm
        working-directory: packages/starlight-agent-docs
        run: pnpm publish --no-git-checks
